<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Full Player</title>
    <style>
        /* တစ်မျက်နှာလုံး အပြည့်ဖြစ်စေရန် */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Iframe ကို မျက်နှာပြင်အပြည့် ချဲ့ခြင်း */
        #myIframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        id="myIframe" 
        src="" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe>

    <script>
        // လက်ရှိ URL (ဥပမာ- player.html?url=https://bcb.cc/mm.mp4) ကနေ
        // parameter ကို ခွဲထုတ်ခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');

        // အကယ်၍ URL မှာ video link ပါလာရင် iframe ရဲ့ src ထဲ ထည့်မယ်
        if (videoUrl) {
            document.getElementById('myIframe').src = videoUrl;
        } else {
            // Link မပါလာခဲ့ရင် default အနေနဲ့ သင်ပေးထားတဲ့ link ကို သုံးမယ်
            document.getElementById('myIframe').src = "https";
        }
    </script>

</body>
</html>
